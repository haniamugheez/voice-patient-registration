# One-click Render blueprint: a free web service + a free Postgres database.
services:
  - type: web
    name: voice-patient-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voice-patient-db
          property: connectionString
      - key: VAPI_SERVER_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"

databases:
  - name: voice-patient-db
    plan: free
    databaseName: patients
